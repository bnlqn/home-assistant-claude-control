<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Home Dashboard Panel — Dev Harness</title>
    <style>
      /* The dev harness mimics the neutral shell Home Assistant provides
         around a custom panel, so the panel looks the same here as in HA. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #e9eaee;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #08090b;
        }
      }
      #app {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/dev/main.ts"></script>
  </body>
</html>
