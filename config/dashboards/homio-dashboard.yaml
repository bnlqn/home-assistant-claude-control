button_card_templates: !include_dir_merge_named /config/dashboards/templates/button_cards
views:
  - type: custom:grid-layout
    title: Home
    path: home
    layout: !include /config/dashboards/templates/includes/homio_screen_layout.yaml
    theme: homio
    cards:
      - type: custom:button-card
        template:
          - homio_room
        name: Home
        variables:
          image: home
          accent: "#3a3f4b"
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout: !include /config/dashboards/templates/includes/homio_entity_layout.yaml
        cards:
          - type: custom:button-card
            variables:
              icon: power_on
            template:
              - homio_light
            entity: light.all_lights
            name: All Lights
          - type: custom:button-card
            variables:
              icon: person
            template:
              - homio_entity
            entity: person.ben
            name: Ben
          - type: custom:button-card
            variables:
              icon: vacuum
            template:
              - homio_entity
            entity: vacuum.roborock_s8_pro_ultra
            name: Vacuum

