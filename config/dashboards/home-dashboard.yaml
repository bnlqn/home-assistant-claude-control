button_card_templates:
  kohbo_default:
    styles:
      card:
      - --mdc-ripple-color: transparent
      - -webkit-tap-highlight-color: transparent
      - position: relative
  kohbo_entity:
    template:
    - kohbo_default
    show_state: true
    styles:
      card:
      - padding: 20px
      name:
      - color: var(--primary-text-color)
      - font-size: 16px
      - font-weight: 600
      - justify-self: start
      - margin-bottom: 5px
      state:
      - color: var(--primary-text-color)
      - font-size: 14px
      - justify-self: start
      - font-weight: 700
      - opacity: 0.8
      img_cell:
      - width: 30px
      - height: 30px
      - background: transparent
      - justify-self: start
      icon:
      - justify-self: start
      - width: 100%
      - height: 100%
  kohbo_device_entity:
    template: kohbo_entity
    layout: vertical
    show_state: true
    size: 100%
    tap_action:
      action: more-info
      haptic: light
    variables:
      last_changed: |
        [[[
          const last = new Date(entity.last_changed);
          const now = new Date();
          const diff = Math.floor((now - last) / 1000);
          if (diff < 3600) {
            return `${Math.floor(diff / 60) + "m"}`;
          } else if (diff < 86400) {
            return `${Math.floor(diff / 3600) + "h"}`;
          } else {
            return `${Math.floor(diff / 86400) + "d"}`;
          }
        ]]]
    state_display: |
      [[[
        function titleCase(str) {
          return str
            .replace(/_/g, " ")
            .toLowerCase()
            .split(" ")
            .map(word => word.charAt(0).toUpperCase() + word.slice(1))
            .join(" ");
        }
        const state = hass.formatEntityState ? hass.formatEntityState(entity): titleCase(entity.state);
        return `${state} - ${variables.last_changed}`;
      ]]]
    styles:
      card:
      - height: 130px
      - margin: 0
      - --mdc-ripple-color: var(--secondary-background-color)
      - --mdc-ripple-press-opacity: 0.8
      name:
      - margin-bottom: 8px
      state:
      - color: var(--secondary-text-color)
      - font-size: 12px
      - font-weight: normal
      - opacity: 1
      img_cell:
      - height: 40px
      - width: 40px
      - margin-bottom: 15px
  kohbo_thermostat_entity:
    template: kohbo_device_entity
    icon: |
      [[[
        if (entity.attributes.preset_mode === 'eco')
          return "mdi:leaf"
        else if (entity.state == "heat_cool")
          return "mdi:sun-snowflake-variant"
        else if (entity.state == "heat")
          return "mdi:heat-wave"
        else if (entity.state == "cool")
          return "mdi:snowflake"
        else if (entity.state == "dry")
          return "mdi:water-percent"
        else if (entity.state == "fan_only")
          return "mdi:fan"
        else
          return "mdi:power"
      ]]]
    state_display: |
      [[[
        if (entity.attributes.preset_mode === 'eco')
          return "Eco Mode"
        else if (entity.state == "heat_cool")
          return `Heat/Cool: ${entity.attributes.target_temp_low} - ${entity.attributes.target_temp_high}`
        else if (entity.state == "heat")
          return `Heat - ${entity.attributes.temperature}°`
        else if (entity.state == "cool")
          return `Cool - ${entity.attributes.temperature}°`
        else if (entity.state == "dry")
          return "Dry"
        else if (entity.state == "fan_only")
          return "Fan Only"
        else
          return "Off"
      ]]]
    styles:
      icon:
      - color: |
          [[[
            if (entity.state == "heat_cool")
              return "var(--info-color, var(--primary-color))";
            else if (entity.state == "heat")
              return "var(--error-color)";
            else if (entity.state == "cool")
              return "var(--primary-color)";
            else if (entity.state == "off")
              return "var(--light-grey-color)";
            else
              return "var(--primary-color)";
          ]]]
  kohbo_room_card_overview:
    size: 100%
    show_icon: true
    show_state: true
    state_display: |
      [[[
        if (entity == null) return "";
        if (entity.state == "on") {
          const b = entity.attributes.brightness;
          return b ? `On · ${Math.round(b / 255 * 100)}%` : "On";
        }
        return "Off";
      ]]]
    variables:
      temperature: null
    styles:
      grid:
      - grid-template-areas: '"i n temperature" "i s temperature"'
      - grid-template-columns: 40px 1fr 60px
      - grid-template-rows: 1fr 1fr
      card:
      - --mdc-ripple-color: transparent
      - --mdc-ripple-press-opacity: 0
      - padding: 20px 20px 20px 20px
      - background: transparent
      - box-shadow: none
      - border: none
      name:
      - padding-left: 16px
      - justify-self: start
      - align-self: end
      - font-size: 18px
      - line-height: 19px
      - font-weight: 700
      - color: var(--primary-text-color)
      state:
      - padding-left: 16px
      - justify-self: start
      - font-size: 11px
      - line-height: 11px
      - font-weight: 500
      - color: var(--secondary-text-color)
      - align-self: start
      - padding-top: 4px
      custom_fields:
        temperature:
        - font-size: 20px
        - line-height: 20px
        - font-weight: 400
        - color: var(--primary-text-color)
        - justify-self: end
        - align-self: center
    custom_fields:
      temperature: |
        [[[
          if (variables.temperature) {
            return Math.round(variables.temperature * 10) / 10 + "°";
          }
          return "";
        ]]]
  kohbo_room_card_device:
    show_state: true
    styles:
      grid:
      - grid-template-areas: '"n n n" "i i i" "s s s"'
      card:
      - background: transparent
      - box-shadow: none
      - padding: 16px 10px
      - border: none
      icon:
      - height: 26px
      - margin-top: 10px
      - margin-bottom: 10px
      name:
      - color: var(--primary-text-color)
      - font-size: 13px
      - font-weight: 500
      state:
      - font-weight: 400
      - color: var(--secondary-text-color)
      - font-size: 11px
    tap_action:
      action: toggle
      haptic: light
    hold_action:
      action: more-info
      haptic: medium
  kohbo_chip_card:
    size: 18px
    show_state: true
    show_name: false
    layout: icon_state
    tap_action:
      action: more-info
      haptic: light
    styles:
      grid:
      - grid-template-areas: '"i s"'
      - grid-template-columns: auto auto
      card:
      - padding: 0 14px
      - display: inline-flex
      - align-items: center
      - height: 38px
      - width: auto
      - box-sizing: border-box
      - min-width: 38px
      - border-radius: 19px
      - background: var(--secondary-background-color)
      - border: none
      - box-shadow: none
      img_cell:
      - width: 18px
      state:
      - color: var(--primary-text-color)
      - font-size: 13px
      - font-weight: 600
      - justify-self: start
      - margin-left: 8px
      - line-height: 14px
  kohbo_header_chip_card:
    template: kohbo_chip_card
    tap_action:
      haptic: light
    styles:
      card:
      - display: flex
      - justify-content: center
      - align-items: center
      - padding: 0
      - background: transparent
      - height: 36px
      - min-width: 36px
      grid:
      - grid-template-areas: '"i"'
      - grid-template-columns: auto
      - justify-content: center
      - align-items: center
  kohbo_page_title:
    styles:
      card:
      - height: 44px
      - background: transparent
      - border: none
      - box-shadow: none
      - margin: 0
      - padding: 0
      name:
      - color: var(--primary-text-color)
      - justify-self: start
      - font-size: 24px
      - font-weight: 600
      - letter-spacing: -.5px
      - font-family: '''Inter'', sans-serif'
  kohbo_header_page_title:
    template: kohbo_page_title
    styles:
      name:
      - justify-self: center
      - font-size: 20px
      - font-weight: 600
      - letter-spacing: -.4px
  kohbo_popup_page_title:
    template: kohbo_page_title
    styles:
      name:
      - justify-self: center
  section_title:
    styles:
      card:
      - background: transparent
      - border: none
      - box-shadow: none
      - padding: 12px 4px 4px 4px
      name:
      - color: var(--secondary-text-color)
      - font-size: 12px
      - text-transform: uppercase
      - letter-spacing: 0.06em
      - font-weight: 700
      - width: 100%
      - text-align: left
      - font-family: '''Inter'', sans-serif'
  kohbo_scene_button:
    show_icon: true
    show_name: true
    show_state: false
    size: 34%
    haptic: light
    styles:
      card:
      - height: 76px
      - background: var(--secondary-background-color)
      - border-radius: 14px
      - border: none
      - box-shadow: none
      name:
      - font-size: 12px
      - font-weight: 600
      - color: var(--primary-text-color)
      icon:
      - color: var(--accent-color)
  kohbo_person_entity:
    show_state: false
    show_name: false
    show_entity_picture: true
    size: 45px
    icon: mdi:account
    styles:
      card:
      - height: 45px
      - width: 45px
      - padding: 0
      - background: transparent
      - border: none
      - border-radius: 0
      img_cell:
      - border-radius: 50%
      custom_fields:
        occupancy_state:
        - background-color: |
            [[[
              if (entity.state == "home") {
                return "var(--success-color)";
              } else {
                return "var(--text-light-primary-color)";
              }
            ]]]
        - border-radius: 50%
        - position: absolute
        - bottom: 0
        - right: 0
        - height: 10px
        - width: 10px
        - box-shadow: 0 0 4px 0 rgba(0, 0, 0, 0.5)
    custom_fields:
      occupancy_state: |
        [[[
          return "";
        ]]]
  kohbo_card_header:
    show_icon: false
    show_state: false
    show_name: true
    styles:
      card:
      - background: transparent
      - box-shadow: none
      - padding: 16px 16px 8px
      name:
      - font-size: 12px
      - font-weight: 600
      - color: var(--secondary-text-color)
      - text-transform: uppercase
      - letter-spacing: 0.5px
      - justify-self: start
      - font-family: '''Inter'', sans-serif'
    tap_action:
      action: none
  kohbo_energy_stat_card:
    show_icon: false
    show_state: false
    show_name: true
    show_label: false
    variables:
      show_divider: false
      unit_label: kWh
    styles:
      grid:
      - grid-template-areas: '"n" "s"'
      - grid-template-columns: 1fr
      - grid-template-rows: auto auto
      - row-gap: 4px
      card:
      - background: transparent
      - padding: 0 16px
      - margin: 16px 0
      - box-shadow: none
      - border-right: |
          [[[ return variables.show_divider ? '1px solid rgba(255,255,255,0.08)' : 'none'; ]]]
      name:
      - font-size: 11px
      - font-weight: 600
      - text-transform: uppercase
      - letter-spacing: 0.3px
      - color: var(--secondary-text-color)
      - text-align: left
      - justify-self: start
      - width: 100%
      - margin-bottom: 4px
      state:
      - font-size: 26px
      - font-weight: 600
      - color: var(--primary-text-color)
      - text-align: left
      - justify-self: start
  kohbo_energy_stat_comparison:
    template: kohbo_energy_stat_card
    variables:
      comparison_type: daily
      comparison_label: vs avg
    styles:
      grid:
      - grid-template-areas: '"n" "v" "c"'
      - grid-template-rows: auto auto auto
      custom_fields:
        v:
        - justify-self: start
        c:
        - justify-self: start
        - margin-top: 2px
    custom_fields:
      v: |
        [[[
          const value = parseFloat(entity?.state || 0);
          const unit = variables.unit_label || 'kWh';
          const type = variables.comparison_type || 'daily';
          const fmt = (n) => {
            if (n >= 10000) return (n / 1000).toFixed(1) + 'k';
            if (n >= 1000) return Math.round(n).toLocaleString();
            return Math.ceil(n).toString();
          };
          const displayValue = (type === 'weekly' || type === 'monthly') ? fmt(value) : value.toFixed(1);
          return `<span style="font-size:26px;font-weight:600;color:var(--primary-text-color);">${displayValue}</span><span style="font-size:12px;color:var(--secondary-text-color);margin-left:4px;">${unit}</span>`;
        ]]]
      c: |
        [[[
          const type = variables.comparison_type || 'daily';
          const label = variables.comparison_label || 'vs avg';
          const dailyBaseline = parseFloat(states['sensor.energy_expected_full_day']?.state || 0);
          let actual = 0;
          let expected = 0;
          if (type === 'daily') {
            actual = parseFloat(states['sensor.energy_forecast_end_of_day']?.state || 0);
            expected = dailyBaseline;
          } else if (type === 'weekly') {
            actual = parseFloat(states['sensor.whole_home_energy_weekly_usage']?.state || 0);
            const dow = new Date().getDay();
            expected = dailyBaseline * (dow === 0 ? 7 : dow);
          } else if (type === 'monthly') {
            actual = parseFloat(states['sensor.whole_home_energy_monthly_usage']?.state || 0);
            expected = dailyBaseline * new Date().getDate();
          }
          const pct = expected > 0 ? Math.round((actual - expected) / expected * 100) : 0;
          const delta = actual - expected;
          const arrow = pct > 5 ? '↑' : pct < -5 ? '↓' : '→';
          const color = pct > 10 ? 'var(--error-color)' : pct < -10 ? 'var(--success-color)' : 'var(--secondary-text-color)';
          const sign = delta > 0 ? '+' : (delta < 0 ? '-' : '');
          let magnitude;
          if (Math.abs(pct) >= 200) {
            const ad = Math.abs(delta);
            const d = ad >= 10000 ? (ad / 1000).toFixed(1) + 'k' : (ad >= 1000 ? Math.round(ad).toLocaleString() : Math.round(ad));
            magnitude = `${sign}${d} kWh`;
          } else {
            magnitude = `${sign}${Math.abs(pct)}%`;
          }
          return `<span style="font-size:11px;font-weight:500;color:${color};">${arrow} ${magnitude} ${label}</span>`;
        ]]]
decluttering_templates:
  room_card:
    card:
      type: custom:stack-in-card
      cards:
      - type: custom:button-card
        entity: '[[light_entity]]'
        name: '[[room_name]]'
        template: kohbo_room_card_overview
        icon: '[[icon]]'
        variables:
          temperature: '[[temperature]]'
        tap_action:
          action: navigate
          navigation_path: '[[navigation_path]]'
          haptic: light
      - type: custom:stack-in-card
        mode: horizontal
        card_mod:
          style: |
            ha-card {
              background: var(--secondary-background-color);
              border-top-right-radius: 0;
              border-top-left-radius: 0;
              box-shadow: none;
              border: none;
              margin-top: 8px;
            }
            hui-horizontal-stack-card$: |
              #root {
                display: flex;
                flex-wrap: wrap;
                justify-content: flex-start;
                gap: 0 !important;
              }
              #root > hui-card > * {
                flex: 0 0 25% !important;
                max-width: 25%;
                box-sizing: border-box;
              }
        cards: '[[room_devices]]'
  room_page_top_toolbar:
    card:
      type: horizontal-stack
      card_mod:
        style: |
          ha-card, #root {
            align-items: center;
          }
      cards:
      - type: custom:button-card
        template: kohbo_header_chip_card
        icon: mdi:arrow-left
        tap_action:
          action: navigate
          navigation_path: '[[navigation_path]]'
          haptic: light
      - type: custom:button-card
        template: kohbo_header_page_title
        name: '[[name]]'
      - type: custom:button-card
        template: kohbo_header_chip_card
        icon: '[[[ return variables.action_icon || ''mdi:palette-outline'' ]]]'
        variables:
          action_icon: '[[action_icon]]'
        tap_action:
          action: navigate
          navigation_path: '[[action_path]]'
          haptic: light
  scene_button:
    card:
      type: custom:button-card
      template: kohbo_scene_button
      entity: '[[scene_entity]]'
      name: '[[scene_name]]'
      icon: '[[[ return variables.icon || ''mdi:palette'' ]]]'
      variables:
        icon: '[[icon]]'
      tap_action:
        action: call-service
        service: scene.turn_on
        target:
          entity_id: '[[scene_entity]]'
        haptic: light
views:
- title: Home
  path: home
  icon: kohbo:kohbo-dashboard
  theme: Kohbo
  cards:
  - type: vertical-stack
    cards:
    - type: horizontal-stack
      card_mod:
        style: 'ha-card, #root { align-items: center; }'
      cards:
      - type: custom:button-card
        template: kohbo_header_chip_card
        icon: mdi:blank
        styles:
          card:
          - opacity: 0
          - pointer-events: none
      - type: custom:button-card
        template: kohbo_header_page_title
        name: Home
      - type: custom:button-card
        template: kohbo_header_chip_card
        icon: kohbo:kohbo-notification
        icon_color: '[[[ return states[''binary_sensor.home_attention''].state == ''on'' ? ''var(--error-color)'' : ''var(--secondary-text-color)'' ]]]'
        tap_action:
          action: more-info
          entity: binary_sensor.home_attention
          haptic: light
    - type: horizontal-stack
      card_mod:
        style: |
          #root { align-items: stretch !important; }
          #root > *:nth-child(1) { flex: 3 !important; }
          #root > *:nth-child(2) { flex: 2 !important; }
      cards:
      - type: horizontal-stack
        card_mod:
          style: '#root { gap: 8px !important; }'
        cards:
        - type: custom:button-card
          template: kohbo_chip_card
          entity: binary_sensor.home_attention
          name: Home Status
          icon: kohbo:kohbo-house-auto
          state:
          - value: 'off'
            icon: kohbo:kohbo-house-auto
            color: var(--success-color)
          - value: 'on'
            icon: kohbo:kohbo-notification
            color: var(--error-color)
          state_display: '[[[ return states[''binary_sensor.home_attention''].state == ''on'' ? (states[''sensor.home_status_message''].state || ''Needs attention'') : ''All good'' ]]]'
          tap_action:
            action: more-info
            entity: binary_sensor.home_attention
            haptic: light
        - type: custom:button-card
          template: kohbo_chip_card
          name: Energy Usage
          icon: mdi:lightning-bolt
          entity: sensor.p1_meter_power
          tap_action:
            action: navigate
            navigation_path: /home-dashboard/energy
            haptic: light
          show_state: true
          styles:
            state:
            - margin-left: 3px
          state:
          - operator: template
            value: '[[[ return parseFloat(entity.state) < 0 ]]]'
            color: var(--success-color)
          - operator: template
            value: '[[[ return parseFloat(entity.state) > 3000 ]]]'
            color: var(--error-color)
          - operator: template
            value: '[[[ return parseFloat(entity.state) > 1500 ]]]'
            color: var(--warning-color)
          - operator: template
            value: '[[[ return parseFloat(entity.state) >= 0 ]]]'
            color: var(--light-grey-color)
          state_display: '[[[ return (parseFloat(entity.state) / 1000).toFixed(2) + '' kW'' ]]]'
        - type: custom:button-card
          template: kohbo_chip_card
          entity: input_boolean.tesla_solar_charging_active
          name: Solar Session
          icon: mdi:car-electric
          state:
          - value: 'off'
            icon: mdi:car-electric
            color: var(--light-grey-color)
          - value: 'on'
            icon: mdi:car-electric
            color: var(--success-color)
          state_display: '[[[ return states[''input_boolean.tesla_solar_charging_active''].state == ''on'' ? ''Solar Only'' : ''Off'' ]]]'
          tap_action:
            action: toggle
            haptic: light
          hold_action:
            action: more-info
            haptic: medium
      - type: horizontal-stack
        card_mod:
          style: '#root { justify-content: flex-end !important; }'
        cards:
        - type: custom:button-card
          template: kohbo_person_entity
          entity: person.ben
          tap_action:
            action: more-info
            haptic: light
    - type: custom:button-card
      template: section_title
      name: Today
    - type: custom:stack-in-card
      mode: vertical
      card_mod:
        style: ':host { --stack-card-gap: 0; --vertical-stack-card-gap: 0 !important; }'
      cards:
      - type: weather-forecast
        entity: weather.forecast_home
        show_current: true
        show_forecast: false
        card_mod:
          style: 'ha-card { box-shadow: none; border-radius: 16px 16px 0 0; }'
      - type: horizontal-stack
        card_mod:
          style: |-
            ha-card { border-radius: 0; background: var(--card-background-color); box-shadow: var(--ha-card-box-shadow, none); margin-top: -1px; padding: 0 12px 12px; }
            #root { gap: 8px !important; justify-content: center !important; }
        cards:
        - type: custom:button-card
          template: kohbo_chip_card
          entity: weather.forecast_home
          icon: mdi:thermometer-high
          show_state: true
          state_display: '[[[ return Math.round(states[''sensor.today_high''].state) + ''°''; ]]]'
          styles:
            card:
            - width: 100%
            - justify-content: center
            icon:
            - color: var(--error-color)
        - type: custom:button-card
          template: kohbo_chip_card
          entity: weather.forecast_home
          icon: mdi:thermometer-low
          show_state: true
          state_display: '[[[ return Math.round(states[''sensor.today_low''].state) + ''°''; ]]]'
          styles:
            card:
            - width: 100%
            - justify-content: center
            icon:
            - color: 'var(--info-color, #59A5D8)'
        - type: custom:button-card
          template: kohbo_chip_card
          entity: weather.forecast_home
          icon: mdi:water-percent
          show_state: true
          state_display: '[[[ return states[''weather.forecast_home''].attributes.humidity + ''%''; ]]]'
          styles:
            card:
            - width: 100%
            - justify-content: center
            icon:
            - color: 'var(--info-color, #59A5D8)'
        - type: custom:button-card
          template: kohbo_chip_card
          entity: weather.forecast_home
          icon: mdi:white-balance-sunny
          show_state: true
          state_display: '[[[ return ''UV '' + states[''weather.forecast_home''].attributes.uv_index; ]]]'
          styles:
            card:
            - width: 100%
            - justify-content: center
            icon:
            - color: '[[[ const uv = states[''weather.forecast_home''].attributes.uv_index; if (uv >= 8) return ''var(--error-color)''; if (uv >= 6) return ''var(--orange-color)''; if (uv >= 3) return ''var(--warning-color)''; return ''var(--success-color)''; ]]]'
      - type: custom:calendar-card-pro
        days_to_show: 1
        show_empty_days: false
        show_past_events: false
        language: en
        time_24h: true
        show_location: false
        entities:
        - entity: calendar.b_lo
          color: var(--primary-color)
        - entity: calendar.kids
          color: var(--accent-color)
        - entity: calendar.ben_personal
