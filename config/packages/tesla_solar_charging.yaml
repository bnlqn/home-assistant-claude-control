# Tesla Model 3 solar-only charging.
#
# Charges the car only from excess solar (dynamic amp-matching / solar
# diverter style), using sensor.p1_meter_power (signed: negative = grid
# export/surplus, positive = grid import) as the surplus signal and the
# tesla_fleet integration's vehicle-side entities for control.
#
# input_boolean.tesla_solar_charging_active is a persistent user-controlled
# mode switch ("solar-only charging enabled"), not a per-session flag - it
# is only ever changed by the user (e.g. the dashboard pill), never by
# these automations. While it's on, the system takes over charging control
# entirely across as many plug-in/unplug cycles as it takes; turn it off
# manually (e.g. before a road trip) to charge at full power outside solar
# control.

input_number:
  tesla_solar_min_charge_current:
    name: Tesla Solar Min Charge Current
    icon: mdi:ev-station
    min: 5
    max: 10
    step: 1
    initial: 5
    unit_of_measurement: A
  tesla_solar_deadband_current_a:
    name: Tesla Solar Charge Current Deadband
    icon: mdi:tune-variant
    min: 1
    max: 5
    step: 1
    initial: 1
    unit_of_measurement: A
  tesla_solar_grid_start_threshold_w:
    name: Tesla Solar Start Export Threshold
    icon: mdi:transmission-tower-export
    min: -5000
    max: -500
    step: 50
    initial: -1300
    unit_of_measurement: W
  tesla_solar_grid_stop_threshold_w:
    name: Tesla Solar Stop Import Threshold
    icon: mdi:transmission-tower-import
    min: 0
    max: 2000
    step: 50
    initial: 200
    unit_of_measurement: W
  tesla_solar_ridethrough_minutes:
    name: Tesla Solar Cloud Ride-Through
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 60
    step: 5
    initial: 20
    unit_of_measurement: min
  tesla_solar_peak_stop_minutes:
    name: Tesla Solar Peak Stop Delay
    icon: mdi:timer-off-outline
    min: 0
    max: 30
    step: 1
    initial: 5
    unit_of_measurement: min
  tesla_solar_cooldown_minutes:
    name: Tesla Solar Restart Cooldown
    icon: mdi:timer-sand
    min: 0
    max: 60
    step: 5
    initial: 15
    unit_of_measurement: min
  tesla_solar_peak_start_hour:
    name: Tesla Solar Peak Start Hour
    icon: mdi:clock-alert-outline
    min: 12
    max: 23
    step: 1
    initial: 17
    unit_of_measurement: h

input_boolean:
  tesla_solar_charging_active:
    name: Tesla Solar Charging Active
    icon: mdi:solar-power-variant

automation:
- id: tesla_solar_start_charging
  alias: "Tesla/Solar: Start Solar Charging"
  description: >
    Starts charging the Tesla Model 3 once net grid power
    (sensor.p1_meter_power) shows export past the threshold needed to
    sustain at least the minimum viable charge current (5A / ~1150W).
    Only acts while solar-only mode is enabled
    (input_boolean.tesla_solar_charging_active, toggled manually by the
    user, e.g. via the dashboard pill) and the charge switch is
    currently off.

    Two triggers: the numeric_state "for 5 minutes" trigger catches the
    clean case quickly, but it's edge-triggered - it fires once per
    crossing and won't retry on its own. Since the vehicle sleeps most
    of the time and Fleet API commands need it awake, relying on that
    trigger alone meant a surplus window was silently missed whenever
    the car happened to be asleep at the exact moment it fired (seen
    repeatedly in automation traces - condition failed on vehicle
    status, never retried because grid power never rose back above the
    threshold to re-arm it). The added time_pattern trigger makes the
    check level-triggered: every 5 minutes it re-evaluates and, if
    everything else still qualifies, actively wakes the car instead of
    just checking whether it happened to already be awake.

    A cooldown condition (tesla_solar_cooldown_minutes) blocks a restart
    within N minutes of the last stop, so a brief sun-peek between clouds
    can't bounce the session straight back on - the anti-short-cycle
    partner to the ride-through guard on the stop automation.
  triggers:
    - trigger: numeric_state
      entity_id: sensor.p1_meter_power
      below: input_number.tesla_solar_grid_start_threshold_w
      for:
        minutes: 5
      id: sustained_crossing
    - trigger: time_pattern
      minutes: "/5"
      id: periodic_retry
  conditions:
    - condition: state
      entity_id: input_boolean.tesla_solar_charging_active
      state: "on"
    - condition: state
      entity_id: switch.other_tesla_model_3_charge
      state: "off"
    - condition: state
      entity_id: binary_sensor.other_tesla_model_3_charge_cable
      state: "on"
    - condition: state
      entity_id: device_tracker.other_tesla_model_3_location
      state: "home"
    - condition: numeric_state
      entity_id: sensor.other_tesla_model_3_battery_level
      below: number.other_tesla_model_3_charge_limit
    - condition: numeric_state
      entity_id: sensor.p1_meter_power
      below: input_number.tesla_solar_grid_start_threshold_w
    # Anti-short-cycle cooldown: don't restart within N minutes of the last
    # charge-switch change. Because the switch is off here (checked above),
    # last_changed marks when we last stopped. This stops a brief sun-peek
    # from bouncing the session straight back on after a cloud-driven stop.
    - condition: template
      value_template: >-
        {{ (now() - states.switch.other_tesla_model_3_charge.last_changed).total_seconds()
           >= states('input_number.tesla_solar_cooldown_minutes') | float(15) * 60 }}
  actions:
    - action: button.press
      target:
        entity_id: button.other_tesla_model_3_wake
    - wait_template: "{{ is_state('binary_sensor.other_tesla_model_3_status', 'on') }}"
      timeout:
        seconds: 90
      continue_on_timeout: true
    - if:
        - condition: state
          entity_id: binary_sensor.other_tesla_model_3_status
          state: "on"
      then:
        - action: number.set_value
          target:
            entity_id: number.other_tesla_model_3_charge_current
          data:
            value: "{{ states('input_number.tesla_solar_min_charge_current') }}"
        - action: switch.turn_on
          target:
            entity_id: switch.other_tesla_model_3_charge
        - action: notify.send_message
          target:
            entity_id: notify.iphone_16_pro
          data:
            title: "Tesla: Solar charging started"
            message: >-
              Started charging the Model 3 from solar surplus. Exporting
              {{ (states('sensor.p1_meter_power') | float(0) | abs) | round(0) }} W
              to the grid; starting at
              {{ states('input_number.tesla_solar_min_charge_current') }}A and will
              ramp up with available sun.
  mode: single

- id: tesla_solar_stop_charging
  alias: "Tesla/Solar: Stop Solar Charging"
  description: >
    Stops a solar-driven charge session when sustained grid import shows
    there's no longer enough surplus to sustain the minimum charge
    current, or when the vehicle itself reports the session finished,
    disconnected, or unavailable. Only acts while solar-only mode is
    enabled (input_boolean.tesla_solar_charging_active) - it turns the
    charge switch off but leaves the mode switch itself untouched, so the
    next plug-in still starts under solar control without the user
    having to re-enable anything.

    Cloud ride-through lives in the surplus-drop trigger's dwell time,
    not in a start-of-session timer, so it protects the whole session
    equally - a cloud passing over a 5-minute-old session and one passing
    over a 3-hour-old session are treated identically. The surplus-drop
    trigger only fires after grid import has stayed above the stop
    threshold *continuously* for the ride-through window; any moment the
    sun peeks back and net power dips below the threshold resets that
    timer. A typical cumulus cloud shades for a few minutes, well under
    the window, so it never fires - the adjust loop has already dropped
    the car to its 5A floor and it simply rides through (tolerating a
    little grid import) until the sun returns. Only a genuinely sustained
    deficit - the sun actually gone - runs the timer out and stops.

    The window is time-of-day dependent: tesla_solar_ridethrough_minutes
    during the cheap-transport daytime window (Wallonia smart meter),
    dropping to the much shorter tesla_solar_peak_stop_minutes from
    tesla_solar_peak_start_hour onward, when importing gets expensive and
    we'd rather stop promptly than ride through on peak-priced grid power.
    A vehicle-reported stop (complete/disconnected/no_power) is always
    immediate and ignores the window entirely, as is a locally-detected
    stop from the wall connector's contactor opening (a LAN-local backstop
    for when the car's Fleet telemetry is asleep or stale).
  triggers:
    - trigger: numeric_state
      entity_id: sensor.p1_meter_power
      above: input_number.tesla_solar_grid_stop_threshold_w
      for:
        minutes: >-
          {{ states('input_number.tesla_solar_ridethrough_minutes') | int(20)
             if now().hour < (states('input_number.tesla_solar_peak_start_hour') | int(17))
             else states('input_number.tesla_solar_peak_stop_minutes') | int(5) }}
      id: no_surplus
    - trigger: state
      entity_id: sensor.other_tesla_model_3_charging
      to:
        - complete
        - disconnected
        - no_power
      id: vehicle_state
    # Local safety net: the wall connector's contactor opens the moment a
    # session physically ends (car full, unplugged, or the car stopped
    # accepting), reported over the LAN with no dependence on the car's
    # Fleet telemetry - which can sit stale for many minutes while asleep.
    # The 60s "for" lets our own switch.turn_off settle first: when *we*
    # stop, the Fleet switch reads "off" well within a minute, so the
    # switch=="on" condition below filters this self-induced re-fire out
    # and only a genuine external stop (switch still on) gets through.
    - trigger: state
      entity_id: binary_sensor.tesla_wall_connector_contactor_closed
      to: "off"
      for:
        seconds: 60
      id: connector_stopped
  conditions:
    - condition: state
      entity_id: input_boolean.tesla_solar_charging_active
      state: "on"
    # Nothing to stop if the charge switch is already off - this also
    # suppresses the contactor re-fire after any self-induced stop.
    - condition: state
      entity_id: switch.other_tesla_model_3_charge
      state: "on"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.other_tesla_model_3_charge
    - action: notify.send_message
      target:
        entity_id: notify.iphone_16_pro
      data:
        title: "Tesla: Solar charging stopped"
        message: >-
          {% if trigger.id == 'no_surplus' -%}
          {% set peak_hour = states('input_number.tesla_solar_peak_start_hour') | int(17) %}
          {% set window = states('input_number.tesla_solar_ridethrough_minutes') | int(20)
                          if now().hour < peak_hour
                          else states('input_number.tesla_solar_peak_stop_minutes') | int(5) %}
          Stopped charging - grid import stayed above the stop threshold
          for {{ window }} min straight (sun genuinely gone, not just a
          passing cloud).
          {%- elif trigger.id == 'connector_stopped' -%}
          Stopped charging - the wall connector reports the session ended
          (contactor open), detected locally. Car full or unplugged
          (battery at {{ states('sensor.other_tesla_model_3_battery_level') }}%).
          {%- else -%}
          Stopped charging - vehicle reports
          "{{ states('sensor.other_tesla_model_3_charging') }}"
          (battery at {{ states('sensor.other_tesla_model_3_battery_level') }}%).
          {%- endif %}
  mode: single

- id: tesla_solar_adjust_current
  alias: "Tesla/Solar: Adjust Solar Charge Current"
  description: >
    Every 5 minutes while a solar charging session is active, nudges the
    car's charge current so total household grid flow tracks toward
    zero (dynamic amp-matching / solar-diverter behaviour). Only calls
    the Fleet API when the computed change is at least the configured
    deadband, to stay well under Tesla's cloud API rate limits and avoid
    keeping a sleeping car awake.

    Headroom is estimated from the Tesla Wall Connector's locally-polled
    telemetry (sensor.tesla_wall_connector_total_power and
    sensor.tesla_wall_connector_phase_a_voltage), NOT the vehicle's Fleet
    cloud telemetry. The connector is read over the LAN and stays fresh
    (~30s) even while the car's cloud telemetry is asleep, and its power
    reading has fine resolution. This matters because the *vehicle's* own
    sensor.other_tesla_model_3_charger_power was observed frozen at a
    single value for 20+ minutes while real draw swung between the 5A and
    14A it was set to (and it reports only whole-kW resolution), which
    once turned this loop into a bang-bang oscillator. Using the
    connector's *measured* draw (rather than a value assumed from the
    commanded setpoint) also tracks reality when the car tapers near its
    charge limit or caps below the setpoint, so the loop stops chasing a
    current the car won't actually take.

    Fallback: if the connector reading is missing/non-numeric or it isn't
    reporting "charging", the loop reverts to the earlier self-referential
    estimate - draw assumed as commanded setpoint x measured voltage -
    which is inherently stable because it never depends on a lagging
    external signal.
  triggers:
    - trigger: time_pattern
      minutes: "/5"
  conditions:
    - condition: state
      entity_id: input_boolean.tesla_solar_charging_active
      state: "on"
    - condition: state
      entity_id: sensor.other_tesla_model_3_charging
      state: "charging"
    - condition: state
      entity_id: binary_sensor.other_tesla_model_3_status
      state: "on"
  actions:
    - variables:
        grid_power_w: "{{ states('sensor.p1_meter_power') | float(0) }}"
        min_amps: "{{ states('input_number.tesla_solar_min_charge_current') | float(5) }}"
        max_amps: 32
        current_amps: "{{ states('number.other_tesla_model_3_charge_current') | float(0) }}"
        # Real voltage measured at the connector (single-phase / phase A),
        # falling back to 230V nominal if the reading is missing.
        wc_voltage: "{{ states('sensor.tesla_wall_connector_phase_a_voltage') | float(0) }}"
        effective_voltage: "{{ wc_voltage if wc_voltage > 50 else 230 }}"
        # Prefer the connector's measured draw; only trust it when the
        # connector says it's charging and reports a meaningful power.
        wc_power_kw: "{{ states('sensor.tesla_wall_connector_total_power') | float(-1) }}"
        wc_ok: "{{ is_state('sensor.tesla_wall_connector_status', 'charging') and wc_power_kw > 0.1 }}"
        car_power_w: "{{ (wc_power_kw * 1000) if wc_ok else (current_amps * effective_voltage) }}"
        ideal_power_w: "{{ car_power_w - grid_power_w }}"
        ideal_amps_raw: "{{ (ideal_power_w / effective_voltage) | round(0) }}"
        target_amps: "{{ [[ideal_amps_raw | float, min_amps] | max, max_amps] | min }}"
        deadband: "{{ states('input_number.tesla_solar_deadband_current_a') | float(1) }}"
    - condition: template
      value_template: "{{ (target_amps - current_amps) | abs >= deadband }}"
    - action: number.set_value
      target:
        entity_id: number.other_tesla_model_3_charge_current
      data:
        value: "{{ target_amps }}"
  mode: single
