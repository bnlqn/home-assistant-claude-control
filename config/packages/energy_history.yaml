# =====================================================================
#  Energy History baseline system
#  Ported from Kohbo's dashboards/kohbo/energy (packages/energy/sensors/energy_history.yaml)
#
#  How it works:
#    1. Four utility_meter helpers slice sensor.p1_meter_energy_import (grid
#       import, cumulative kWh) into hourly/daily/weekly/monthly windows.
#    2. Every hour at :05, an automation snapshots the previous hour's usage
#       into one of 48 input_number "buckets" - one per hour-of-day (00-23),
#       split weekday vs weekend.
#    3. A statistics sensor per bucket computes a rolling 30-day mean - that
#       mean IS "expected usage for e.g. weekday 14:00". No external
#       forecasting service; it's just averaged history.
#    4. Template sensors sum the 24 bucket-means into expected-so-far /
#       remaining / full-day, and combine with today's actual usage for an
#       end-of-day forecast and trend status.
#
#  Note: sensor.p1_meter_energy_import is grid import, not true whole-home
#  consumption - self-consumed solar (drawn straight from GoodWe, never
#  touching the grid) isn't counted. That's the same simplification Kohbo's
#  own source makes (it just sums two literal panel meters); a true
#  consumption figure would need grid_import + solar_produced - grid_export,
#  which is riskier to feed into utility_meter (a small negative dip reads as
#  a meter reset). Import alone is honest and monotonic.
#
#  Needs ~30 days of real data before the averages (baselines) mean anything;
#  before that "Ready" stays false and expected/forecast read as 0.
#
#  Enable packages ONCE in configuration.yaml:
#      homeassistant:
#        packages: !include_dir_named packages
#  Then place this file at: /config/packages/energy_history.yaml
# =====================================================================

utility_meter:
  whole_home_energy_hourly_usage:
    source: sensor.p1_meter_energy_import
    cycle: hourly
  whole_home_energy_daily_usage:
    source: sensor.p1_meter_energy_import
    cycle: daily
  whole_home_energy_weekly_usage:
    source: sensor.p1_meter_energy_import
    cycle: weekly
  whole_home_energy_monthly_usage:
    source: sensor.p1_meter_energy_import
    cycle: monthly

