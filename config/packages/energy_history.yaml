automation:
- id: energy_history_hourly_snapshot
  alias: 'Energy History: Hourly Snapshot'
  description: Captures the previous hour's grid-import usage into the matching weekday/weekend hour-of-day
    bucket, so the 30-day rolling average per bucket can build up into an "expected usage" baseline.
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: '5'
    seconds: '0'
  variables:
    prev_hour: '{{ (now().hour - 1) % 24 }}'
    prev_dow: |-
      {% set ts = as_timestamp(now()) %}
      {% if now().hour == 0 %}
        {{ (ts - 86400) | timestamp_custom('%w', true) | int }}
      {% else %}
        {{ ts | timestamp_custom('%w', true) | int }}
      {% endif %}
    is_weekend: '{{ prev_dow in [0, 6] }}'
    bin_prefix: |-
      {{ 'energy_weekend_h' if is_weekend else 'energy_weekday_h' }}
    target_entity: |-
      {{ 'input_number.' ~ bin_prefix ~ '%02d'|format(prev_hour) }}
  actions:
  - wait_template: |-
      {{ state_attr('sensor.whole_home_energy_hourly_usage', 'last_period') is not none }}
    timeout: 00:03:00
    continue_on_timeout: false
  - variables:
      prev_val: |-
        {% set v = state_attr('sensor.whole_home_energy_hourly_usage', 'last_period') %}
        {{ 0 if v is none else (v | float(0)) }}
  - condition: template
    value_template: '{{ prev_val > 0 }}'
  - action: input_number.set_value
    target:
      entity_id: '{{ target_entity }}'
    data:
      value: '{{ prev_val }}'

