- id: playground_remote_button1_on
  alias: "Playground Remote: Button 1 -> Lights On"
  description: >
    Physical Hue remote in the Playground (4-button, registered in HA
    under a legacy device name, "Office switch"), button 1. Turns the
    Playground lights on via light.turn_on so Adaptive Lighting (which
    intercepts turn_on calls) sets the brightness/color temp instead
    of a fixed scene.
  triggers:
    - trigger: state
      entity_id: event.playground_office_switch_button_1
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'initial_press' }}"
  actions:
    - action: light.turn_on
      target:
        entity_id: light.playground_playground
  mode: single
