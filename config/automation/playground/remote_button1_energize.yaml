- id: playground_remote_button1_energize
  alias: "Playground Remote: Button 1 -> Energize"
  description: >
    Physical Hue remote in the Playground (4-button, registered in HA
    under a legacy device name, "Office switch"), button 1. Activates
    the Energize scene.
  triggers:
    - trigger: state
      entity_id: event.playground_office_switch_button_1
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'initial_press' }}"
  actions:
    - action: scene.turn_on
      target:
        entity_id: scene.playground_playground_energize
  mode: single
