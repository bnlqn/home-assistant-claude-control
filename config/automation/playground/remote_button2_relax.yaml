- id: playground_remote_button2_relax
  alias: "Playground Remote: Button 2 -> Relax"
  description: >
    Physical Hue remote in the Playground (4-button), button 2.
    Activates the Relax scene.
  triggers:
    - trigger: state
      entity_id: event.playground_office_switch_button_2
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'initial_press' }}"
  actions:
    - action: scene.turn_on
      target:
        entity_id: scene.playground_playground_relax
  mode: single
