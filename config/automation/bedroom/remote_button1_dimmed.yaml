- id: bedroom_remote_button1_dimmed
  alias: "Bedroom Remote: Button 1 -> Dimmed"
  description: >
    Physical Hue remote in the Bedroom (4-button), button 1. Activates
    the Dimmed scene.
  triggers:
    - trigger: state
      entity_id: event.bedroom_switch_button_1
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'initial_press' }}"
  actions:
    - action: scene.turn_on
      target:
        entity_id: scene.bedroom_bedroom_dimmed
      data:
        transition: 2
  mode: single
