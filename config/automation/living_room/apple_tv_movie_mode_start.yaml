- id: living_room_apple_tv_movie_mode_start
  alias: "Living Room Apple TV: Movie Mode Start"
  description: >
    When the Apple TV starts playing via Netflix, Infuse or the Apple TV+
    ("TV") app, activates the Living Room movie scene and turns off
    adaptive lighting for the Living Room so it doesn't fight the scene.
  triggers:
    - trigger: state
      entity_id: media_player.tv_tv
      to: "playing"
    - trigger: state
      entity_id: media_player.tv_tv
      attribute: source
  conditions:
    - condition: state
      entity_id: media_player.tv_tv
      state: "playing"
    - condition: template
      value_template: "{{ trigger.to_state.attributes.source in ['Netflix', 'Infuse', 'TV'] }}"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.living_room_adaptive_lighting_living_room
    - action: scene.turn_on
      target:
        entity_id: scene.living_room_living_room_movie
  mode: single
