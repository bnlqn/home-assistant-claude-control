- id: living_room_remote_toggle
  alias: "Living Room Remote: Toggle Lights"
  description: >
    Physical Hue remote in the Living Room, single button. Toggles the
    lights for the whole open living space (Living Room, Dining Room and
    Kitchen) together. Turning on also enables adaptive lighting for all
    three rooms so they don't stay on whatever fixed scene/state each
    room's lights were last left in.
  triggers:
    - trigger: state
      entity_id: event.living_room_living_room_switch_button_1
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'initial_press' }}"
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: light.living_room_living_room
              state: "off"
          sequence:
            - action: switch.turn_on
              target:
                entity_id:
                  - switch.living_room_adaptive_lighting_living_room
                  - switch.kitchen_adaptive_lighting_kitchen
                  - switch.dining_adaptive_lighting_dining
            - action: light.turn_on
              target:
                entity_id:
                  - light.living_room_living_room
                  - light.kitchen
                  - light.dining
              data:
                transition: 2
      default:
        - action: light.turn_off
          target:
            entity_id:
              - light.living_room_living_room
              - light.kitchen
              - light.dining
          data:
            transition: 2
  mode: single
