- id: juliens_bedroom_remote_toggle
  alias: "Julien's Bedroom Remote: Toggle Lights"
  description: >
    Philips Hue Wall Switch Module in Julien's Bedroom, single input.
    Turns all room lights on or off depending on current state. Uses
    explicit light.turn_on/light.turn_off rather than light.toggle so
    Adaptive Lighting's turn_on intercept reliably adapts the lights
    instead of applying a fixed brightness (same class of bug fixed
    for the office remote).
  triggers:
    - trigger: state
      entity_id: event.juliens_bedroom_juliens_bedroom_switch_button_1
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'initial_press' }}"
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: light.juliens_bedroom_juliens_bedroom
              state: "off"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.juliens_bedroom_juliens_bedroom
      default:
        - action: light.turn_off
          target:
            entity_id: light.juliens_bedroom_juliens_bedroom
          data:
            transition: 2
  mode: single
