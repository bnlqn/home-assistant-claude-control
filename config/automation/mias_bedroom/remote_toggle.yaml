- id: mias_bedroom_remote_toggle
  alias: "Mia's Bedroom Remote: Toggle Lights"
  description: >
    Physical Hue remote in Mia's Bedroom, single button (registered
    in HA under a legacy device name, "Marci's bedroom switch").
    Turns all room lights on or off depending on current state. Uses
    explicit light.turn_on/light.turn_off rather than light.toggle so
    Adaptive Lighting's turn_on intercept reliably adapts the lights
    instead of applying a fixed brightness (same class of bug fixed
    for the office remote and Julien's bedroom).
  triggers:
    - trigger: state
      entity_id: event.mias_bedroom_marcis_bedroom_switch_button_1
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'initial_press' }}"
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: light.mias_bedroom_mias_bedroom
              state: "off"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.mias_bedroom_mias_bedroom
      default:
        - action: light.turn_off
          target:
            entity_id: light.mias_bedroom_mias_bedroom
          data:
            transition: 2
  mode: single
