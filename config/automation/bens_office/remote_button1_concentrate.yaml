- id: office_remote_button1_concentrate
  alias: "Office Remote: Button 1 -> Concentrate"
  description: >
    Physical Hue remote on Ben's desk, button 1. Activates the
    Concentrate scene for the office.
  triggers:
    - trigger: state
      entity_id: event.bens_office_tv_switch_button_1
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'initial_press' }}"
  actions:
    - action: scene.turn_on
      target:
        entity_id: scene.bens_office_bens_office_concentrate
  mode: single
