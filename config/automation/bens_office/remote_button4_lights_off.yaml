- id: office_remote_button4_lights_off
  alias: "Office Remote: Button 4 -> All Lights Off"
  description: >
    Physical Hue remote on Ben's desk, button 4. Turns off every
    light in the office.
  triggers:
    - trigger: state
      entity_id: event.bens_office_tv_switch_button_4
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'initial_press' }}"
  actions:
    - action: light.turn_off
      target:
        entity_id: light.bens_office_bens_office
      data:
        transition: 2
  mode: single
