- id: office_remote_button2_relax
  alias: "Office Remote: Button 2 -> Relax"
  description: >
    Physical Hue remote on Ben's desk, button 2. Activates the
    Relax scene for the office.
  triggers:
    - trigger: state
      entity_id: event.bens_office_tv_switch_button_2
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'initial_press' }}"
  actions:
    - action: scene.turn_on
      target:
        entity_id: scene.bens_office_bens_office_relax
  mode: single
