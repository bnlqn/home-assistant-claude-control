- id: office_remote_button3_energize
  alias: "Office Remote: Button 3 -> Energize"
  description: >
    Physical Hue remote on Ben's desk, button 3. Activates the
    Energize scene for the office.
  triggers:
    - trigger: state
      entity_id: event.bens_office_tv_switch_button_3
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'initial_press' }}"
  actions:
    - action: scene.turn_on
      target:
        entity_id: scene.bens_office_bens_office_energize
  mode: single
