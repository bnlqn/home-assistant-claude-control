- id: office_airco_auto_cool_on
  alias: "Office Airco: Auto Cool On"
  description: >
    Starts cooling the office Airco (target 23°C) once the room has been
    above 24°C for 5 minutes, so a brief spike doesn't trigger it on its
    own. It's the only AC in the house and Ben works in this attic office
    all day, so once started it's left running continuously — the unit's
    own inverter modulates against the 23°C target rather than the
    automation cycling it off. See office_airco_auto_cool_off for the
    actual shutoff condition.
  triggers:
    - trigger: numeric_state
      entity_id: sensor.ec3a56bc6527_indoor_temperature
      above: 24
      for:
        minutes: 5
  actions:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.ec3a56bc6527
      data:
        hvac_mode: cool
    - action: climate.set_temperature
      target:
        entity_id: climate.ec3a56bc6527
      data:
        temperature: 23
  mode: single
