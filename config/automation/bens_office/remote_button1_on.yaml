- id: office_remote_button1_on
  alias: "Office Remote: Button 1 -> Lights On"
  description: >
    Physical Hue remote on Ben's desk, button 1. Turns the office
    lights on via light.turn_on so Adaptive Lighting (which
    intercepts turn_on calls) sets the brightness/color temp
    instead of a fixed scene.
  triggers:
    - trigger: state
      entity_id: event.bens_office_tv_switch_button_1
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'initial_press' }}"
  actions:
    - action: light.turn_on
      target:
        entity_id: light.bens_office_bens_office
  mode: single
